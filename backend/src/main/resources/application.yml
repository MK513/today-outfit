spring:
  application:
    name: today-outfit-backend
  config:
    # 로컬 비밀값(backend/.env). 배포 환경에서는 파일 없이 환경변수로 주입한다.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:today_outfit}}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway가 관리하고, JPA는 엔티티와 일치하는지만 검사한다.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    # API 명세 공통 규칙: 필드 명명은 snake_case
    property-naming-strategy: SNAKE_CASE
  data:
    web:
      pageable:
        # 명세: page는 1부터, size 기본 20 · 최대 100
        one-indexed-parameters: true
        default-page-size: 20
        max-page-size: 100

server:
  port: ${PORT:8080}
  # API 명세의 서버 URL(http://localhost:8080/api)과 맞춘다.
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
