spring:
  application:
    name: today-outfit-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/today_outfit}
    username: ${DB_USERNAME:today_outfit}
    password: ${DB_PASSWORD:today_outfit}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway가 관리하고, JPA는 엔티티와 일치하는지만 검사한다.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  # API 명세의 서버 URL(http://localhost:8080/api)과 맞춘다.
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
