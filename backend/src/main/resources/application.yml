spring:
  application:
    name: today-outfit-backend
  config:
    # 로컬 비밀값(backend/.env). 배포 환경에서는 파일 없이 환경변수로 주입한다.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:today_outfit}}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway가 관리하고, JPA는 엔티티와 일치하는지만 검사한다.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # 명세: 사진은 5MB 이하 (초과 시 400 INVALID_FILE)
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    # API 명세 공통 규칙: 필드 명명은 snake_case
    property-naming-strategy: SNAKE_CASE
  data:
    web:
      pageable:
        # 명세: page는 1부터, size 기본 20 · 최대 100
        one-indexed-parameters: true
        default-page-size: 20
        max-page-size: 100

app:
  jwt:
    secret: ${JWT_SECRET}
    # Access Token 유효 시간(초). 명세 예시값 3600
    expires-in: ${JWT_EXPIRES_IN:3600}

  image:
    # 사진 저장소 구현 (local). 다른 저장소를 추가하면 ImageStore 구현체와 함께 값을 늘린다.
    storage: ${IMAGE_STORAGE:local}
    local:
      # 업로드 사진 저장 폴더 (backend/ 기준 상대 경로, 커밋하지 않음)
      dir: ${IMAGE_DIR:./uploads/images}
      # context-path(/api) 포함. 클라이언트는 이 경로 + 저장소 키로 사진을 불러온다.
      public-path: /api/images

server:
  port: ${PORT:8080}
  # API 명세의 서버 URL(http://localhost:8080/api)과 맞춘다.
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
