openapi: 3.0.3
info:
  title: 오늘 뭐 입지 (Today Outfit) API
  description: |
    AI 기반 옷장 관리 · 코디 추천 · 주간 플래너 서비스 "오늘 뭐 입지"의 RESTful API 명세서입니다.

    ## 인증 방식
    - 로그인(또는 데모 체험) 성공 시 JWT Access Token을 발급하며, `/auth/**`를 제외한 모든 요청은
      `Authorization: Bearer {token}` 헤더를 포함합니다. (과제 기준에 따라 Security Schemes 정의는 생략)
    - 모든 리소스는 로그인 사용자 본인 소유 데이터만 접근 가능하며, 타인 리소스 접근 시 404를 반환합니다.

    ## 공통 규칙
    - 필드 명명: snake_case
    - 날짜 형식: `YYYY-MM-DD`, 일시 형식: ISO 8601 (예: 2026-09-17T09:30:00)
    - 페이지네이션: 목록 API는 page(1부터), size 쿼리 파라미터를 지원하며 PagedResponse 래퍼로 반환합니다.
    - 에러 응답: Error 스키마 공통 사용. `error_code`로 화면 분기(예: AI_ANALYSIS_FAILED → "수동 등록으로 이동" 버튼 노출)
    - AI 기능(`/ai/**`)은 결과를 **저장하지 않고 후보만 반환**합니다. 사용자가 확인 후 저장 API를 호출해야 DB에 반영됩니다.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api
    description: 로컬 개발 서버

tags:
  - name: Auth
    description: 회원가입 · 로그인 · 데모 체험 (로그인/회원가입 화면)
  - name: User
    description: 내 정보 · 계정 탈퇴 (설정 화면)
  - name: Home
    description: 홈 화면 요약 · 오늘의 픽
  - name: Clothes
    description: 옷장 의류 등록/조회/삭제 (옷장 · 의류 등록 · 의류 상세 화면)
  - name: Outfits
    description: 코디 저장/조회/삭제 (내 코디 · 코디 만들기 · 코디 상세 화면)
  - name: Planner
    description: 날짜별 코디 배치 (주간 플래너 화면)
  - name: Challenge
    description: 좌/우 선택 코디 챌린지 (챌린지 화면)
  - name: AI
    description: AI 분석 · 추천 · 평가 (외부 AI 모델 연동, 결과 미저장)

paths:
  # ==========================================
  # [Auth] 로그인 및 회원가입
  # ==========================================
  /auth/signup:
    post:
      tags: [Auth]
      summary: 회원가입
      description: |
        이메일, 비밀번호, 이름으로 가입합니다. 이메일은 소문자로 정규화하여 중복을 검사합니다.
        가입 성공 시 로그인 화면으로 이동하며 토큰은 발급하지 않습니다.
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, password_confirm, name]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 100
                  example: you@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: demo1234
                password_confirm:
                  type: string
                  format: password
                  description: 비밀번호 확인 (password와 불일치 시 400 PASSWORD_MISMATCH)
                  example: demo1234
                name:
                  type: string
                  maxLength: 30
                  example: 김민
      responses:
        '201':
          description: 가입 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      tags: [Auth]
      summary: 로그인
      description: 이메일과 비밀번호로 로그인합니다. 성공 시 JWT Access Token과 사용자 정보를 반환합니다.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: demo@today-outfit.app
                password:
                  type: string
                  format: password
                  example: demo1234
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/demo:
    post:
      tags: [Auth]
      summary: 데모 계정으로 체험하기
      description: |
        데모 계정(is_demo=true)으로 로그인합니다. 계정이 없으면 샘플 의류 14벌, 샘플 코디 2개,
        내일 날짜 플래너 배치 1건을 함께 생성한 뒤 토큰을 발급합니다.
      operationId: loginDemo
      responses:
        '200':
          description: 데모 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: 로그아웃
      description: 현재 Access Token을 무효화(블랙리스트 등록)합니다. 클라이언트는 저장된 토큰을 삭제하고 로그인 화면으로 이동합니다.
      operationId: logout
      responses:
        '204':
          description: 로그아웃 완료 (No Content)
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==========================================
  # [User] 내 정보 · 탈퇴
  # ==========================================
  /users/me:
    get:
      tags: [User]
      summary: 내 정보 조회
      description: 설정 화면 상단의 이름과 이메일을 조회합니다.
      operationId: getMe
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/withdrawal:
    post:
      tags: [User]
      summary: 계정 탈퇴
      description: |
        현재 비밀번호를 재확인한 뒤 계정을 삭제합니다.
        의류 사진·의류·코디·플래너 배치·AI 호출 이력이 모두 함께 삭제되며 복구할 수 없습니다.
      operationId: withdraw
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
                  description: 현재 비밀번호 (불일치 시 400 INVALID_PASSWORD)
      responses:
        '204':
          description: 탈퇴 완료 (No Content)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==========================================
  # [Home] 홈 화면
  # ==========================================
  /home/summary:
    get:
      tags: [Home]
      summary: 홈 화면 요약 조회
      description: |
        홈 화면 렌더링에 필요한 정보를 한 번에 조회합니다.
        - clothes_count = 0 → "아직 등록된 옷이 없어요" 빈 상태
        - today_schedule != null → "오늘의 코디 (확정됨)" 카드
        - today_schedule == null → "오늘 뭐 입지?" 뽑기 카드
      operationId: getHomeSummary
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /home/today-pick:
    post:
      tags: [Home]
      summary: 오늘의 픽 뽑기 (다시 돌리기)
      description: |
        상의·하의·신발·액세서리 슬롯별로 보유 의류 중 하나를 무작위로 뽑습니다.
        - locked_clothing_ids: 잠금한 의류는 그대로 유지
        - exclude_clothing_ids: 직전 결과와 같은 옷이 연속으로 나오지 않도록 제외 (후보가 1벌뿐이면 무시)
        - 해당 카테고리 의류가 없으면 clothing = null ("OO 없음" 표시)
        결과는 저장하지 않으며, "이걸로 입을래요" 클릭 시 POST /outfits(source=RANDOM) → PUT /planner/schedules/{오늘}을 호출합니다.
      operationId: drawTodayPick
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                locked_clothing_ids:
                  type: array
                  items:
                    type: integer
                    format: int64
                  example: [12]
                exclude_clothing_ids:
                  type: array
                  items:
                    type: integer
                    format: int64
                  example: [3, 7, 11]
      responses:
        '200':
          description: 뽑기 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  slots:
                    type: array
                    items:
                      $ref: '#/components/schemas/OutfitSlot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ==========================================
  # [Clothes] 옷장
  # ==========================================
  /clothes:
    get:
      tags: [Clothes]
      summary: 내 옷장 목록 조회 (필터)
      description: 카테고리·계절·색상 필터를 조합하여 최신 등록순으로 조회합니다. 필터 미입력 시 전체 조회.
      operationId: listClothes
      parameters:
        - name: category
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ClothingCategory'
        - name: season
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SeasonType'
        - name: color
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ClothingColor'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: 성공 (결과 0건이면 content = [] → "조건에 맞는 옷이 없어요")
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      content:
                        type: array
                        items:
                          $ref: '#/components/schemas/Clothing'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Clothes]
      summary: 의류 등록 (사진 확인 저장 / 직접 입력)
      description: |
        의류 1벌을 등록합니다.
        - 사진 등록: POST /ai/clothes/photo-analysis 결과(image_url 포함)를 사용자가 수정한 뒤 source=PHOTO로 저장
        - 직접 등록: (선택) POST /images로 사진 업로드 후 source=MANUAL로 저장
      operationId: createClothing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClothingCreateRequest'
      responses:
        '201':
          description: 등록 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clothing'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /clothes/bulk:
    post:
      tags: [Clothes]
      summary: 의류 일괄 등록 (문장 등록)
      description: |
        문장 파싱 후보(POST /ai/clothes/text-parse)를 사용자가 수정·삭제한 뒤 한 번에 저장합니다.
        하나의 트랜잭션으로 처리하며, 한 건이라도 검증에 실패하면 전체 저장하지 않습니다. (최대 8벌)
      operationId: createClothesBulk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 8
                  items:
                    $ref: '#/components/schemas/ClothingCreateRequest'
      responses:
        '201':
          description: 일괄 등록 완료
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Clothing'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /clothes/{clothingId}:
    get:
      tags: [Clothes]
      summary: 의류 상세 조회
      operationId: getClothing
      parameters:
        - $ref: '#/components/parameters/ClothingIdPath'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clothing'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Clothes]
      summary: 의류 삭제
      description: 의류를 삭제합니다. 이 의류를 포함한 코디에서는 해당 의류만 빠지고 코디는 유지됩니다. 업로드 사진도 저장소에서 삭제합니다.
      operationId: deleteClothing
      parameters:
        - $ref: '#/components/parameters/ClothingIdPath'
      responses:
        '204':
          description: 삭제 완료 (No Content)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /images:
    post:
      tags: [Clothes]
      summary: 의류 사진 업로드
      description: 직접 입력 등록에서 선택한 사진을 저장소에 업로드하고 URL을 반환합니다. JPG/PNG, 5MB 이하만 허용합니다.
      operationId: uploadImage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: 의류 사진 (image/jpeg, image/png, 최대 5MB)
      responses:
        '201':
          description: 업로드 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUpload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==========================================
  # [Outfits] 코디
  # ==========================================
  /outfits:
    get:
      tags: [Outfits]
      summary: 내 코디 목록 조회
      description: 저장한 코디를 최신순으로 조회합니다. 플래너의 "배치할 코디 선택" 시트에서도 사용합니다.
      operationId: listOutfits
      parameters:
        - name: source
          in: query
          required: false
          description: 생성 경로 필터
          schema:
            $ref: '#/components/schemas/OutfitSource'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      content:
                        type: array
                        items:
                          $ref: '#/components/schemas/OutfitSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Outfits]
      summary: 코디 저장 (AI 추천 / 직접 제작 / 오늘의 픽 / 챌린지)
      description: |
        의류 조합을 코디로 저장합니다. clothing_ids의 배열 순서가 item_order로 저장됩니다.
        - source=AI: request_text, ai_reason 포함
        - source=CHALLENGE: ai_score, ai_comment, ai_tags 포함 (AI 평가 실패 시 생략 가능)
        - clothing_ids에 본인 소유가 아닌 의류가 있으면 400 INVALID_CLOTHING
      operationId: createOutfit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutfitCreateRequest'
      responses:
        '201':
          description: 저장 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutfitDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /outfits/{outfitId}:
    get:
      tags: [Outfits]
      summary: 코디 상세 조회
      description: 구성 의류(순서대로), 입력한 상황, AI 추천 이유/평가, 메모를 조회합니다.
      operationId: getOutfit
      parameters:
        - $ref: '#/components/parameters/OutfitIdPath'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutfitDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Outfits]
      summary: 코디 삭제
      description: 코디를 삭제합니다. 이 코디가 배치된 플래너 날짜도 함께 해제됩니다.
      operationId: deleteOutfit
      parameters:
        - $ref: '#/components/parameters/OutfitIdPath'
      responses:
        '204':
          description: 삭제 완료 (No Content)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================
  # [Planner] 주간 플래너
  # ==========================================
  /planner/schedules:
    get:
      tags: [Planner]
      summary: 기간별 코디 배치 조회
      description: 주간 플래너(월~일 7일) 화면에 표시할 날짜별 배치를 조회합니다. 조회 기간은 최대 31일입니다.
      operationId: listSchedules
      parameters:
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            format: date
            example: '2026-09-14'
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            format: date
            example: '2026-09-20'
      responses:
        '200':
          description: 성공 (배치가 없는 날짜는 목록에 포함되지 않음 → "+ 코디 배치하기")
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Schedule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /planner/schedules/{planDate}:
    put:
      tags: [Planner]
      summary: 날짜에 코디 배치 / 교체 (업서트)
      description: |
        해당 날짜에 코디를 배치합니다. (user_id, plan_date) 기준 업서트로 동작합니다.
        - 배치가 없던 날짜 → 201 Created ("코디를 배치했어요")
        - 이미 배치된 날짜 → 기존 코디를 교체하고 200 OK ("코디를 교체했어요")
      operationId: upsertSchedule
      parameters:
        - $ref: '#/components/parameters/PlanDatePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outfit_id]
              properties:
                outfit_id:
                  type: integer
                  format: int64
                  example: 21
      responses:
        '200':
          description: 기존 배치 교체 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '201':
          description: 신규 배치 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Planner]
      summary: 날짜 배치 해제
      operationId: deleteSchedule
      parameters:
        - $ref: '#/components/parameters/PlanDatePath'
      responses:
        '204':
          description: 해제 완료 (No Content)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /planner/weekly-outfits:
    post:
      tags: [Planner]
      summary: AI 주간 추천 결과 플래너에 전체 저장
      description: |
        POST /ai/planner/weekly-recommend 결과를 날짜별 코디(source=AI, 이름 "AI 주간 코디 M.D")로 생성하고
        각 날짜에 배치합니다. 이미 배치된 날짜는 교체됩니다. 하나의 트랜잭션으로 처리합니다.
      operationId: saveWeeklyOutfits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_text, days]
              properties:
                request_text:
                  type: string
                  maxLength: 500
                  example: 다음 주는 회사 출근이 많아요
                days:
                  type: array
                  minItems: 1
                  maxItems: 7
                  items:
                    type: object
                    required: [plan_date, clothing_ids, ai_reason]
                    properties:
                      plan_date:
                        type: string
                        format: date
                      clothing_ids:
                        type: array
                        minItems: 1
                        items:
                          type: integer
                          format: int64
                      ai_reason:
                        type: string
      responses:
        '201':
          description: 저장 및 배치 완료
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Schedule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==========================================
  # [Challenge] 코디 챌린지
  # ==========================================
  /challenge/rounds:
    get:
      tags: [Challenge]
      summary: 챌린지 라운드 생성
      description: |
        상의 → 하의 → 신발 → 모자 → 액세서리 순서로, 보유 의류가 2벌 이상인 카테고리마다
        무작위 2벌(left/right)을 뽑아 라운드를 구성합니다. 2벌 미만인 카테고리는 skipped_categories로 반환합니다.
        생성 가능한 라운드가 하나도 없으면 422 NOT_ENOUGH_CLOTHES ("챌린지를 시작할 수 없어요").
      operationId: getChallengeRounds
      responses:
        '200':
          description: 라운드 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeRounds'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ==========================================
  # [AI] 분석 · 추천 · 평가 (결과 미저장)
  # ==========================================
  /ai/clothes/photo-analysis:
    post:
      tags: [AI]
      summary: 의류 사진 AI 분석
      description: |
        사진을 업로드하면 저장소에 임시 보관 후 AI 비전 모델로 이름·카테고리·색상·계절 후보를 추정합니다.
        반환된 image_url은 POST /clothes 저장 시 그대로 사용합니다. (미저장 사진은 24시간 후 정리)
      operationId: analyzeClothingPhoto
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: 의류 사진 (image/jpeg, image/png, 최대 5MB)
      responses:
        '200':
          description: 분석 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoAnalysisResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/AiServiceError'

  /ai/clothes/text-parse:
    post:
      tags: [AI]
      summary: 의류 문장 AI 파싱
      description: 여러 벌의 옷을 설명한 문장을 분해하여 의류 후보 목록(최대 8건)을 반환합니다.
      operationId: parseClothingText
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sentence]
              properties:
                sentence:
                  type: string
                  minLength: 1
                  maxLength: 500
                  example: 베이지 니트, 블루 데님 팬츠, 화이트 스니커즈
      responses:
        '200':
          description: 파싱 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidates:
                    type: array
                    maxItems: 8
                    items:
                      $ref: '#/components/schemas/ClothingCandidate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/AiServiceError'

  /ai/outfits/recommend:
    post:
      tags: [AI]
      summary: 상황 기반 AI 코디 추천
      description: |
        사용자가 입력한 상황과 보유 의류를 AI 모델에 전달하여 슬롯(상의·하의·신발·액세서리)별 코디와 추천 이유를 반환합니다.
        보유 의류가 없으면 422 NO_CLOTHES.
      operationId: recommendOutfit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [situation]
              properties:
                situation:
                  type: string
                  minLength: 1
                  maxLength: 500
                  example: 친구와 카페에서 만나는 캐주얼한 자리
      responses:
        '200':
          description: 추천 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutfitRecommendation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/AiServiceError'

  /ai/outfits/evaluate:
    post:
      tags: [AI]
      summary: 챌린지 코디 AI 평가
      description: 챌린지에서 선택한 의류 조합을 평가하여 점수(0~100), 코멘트, 스타일 태그 3개를 반환합니다.
      operationId: evaluateOutfit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clothing_ids]
              properties:
                clothing_ids:
                  type: array
                  minItems: 1
                  items:
                    type: integer
                    format: int64
                  example: [2, 5, 7, 9, 12]
      responses:
        '200':
          description: 평가 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutfitEvaluation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/AiServiceError'

  /ai/planner/weekly-recommend:
    post:
      tags: [AI]
      summary: AI 주간 코디 추천
      description: |
        시작일부터 1~7일간의 날짜별 코디를 추천합니다.
        보유 의류가 부족하면 만들 수 있는 날짜까지만 반환하며, generated_days < requested_days로 부분 생성을 알립니다.
        하루치도 만들 수 없으면 422 NO_CLOTHES.
      operationId: recommendWeeklyOutfits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [situation, start_date, days]
              properties:
                situation:
                  type: string
                  minLength: 1
                  maxLength: 500
                  example: 다음 주는 회사 출근이 많아요
                start_date:
                  type: string
                  format: date
                  example: '2026-09-21'
                days:
                  type: integer
                  minimum: 1
                  maximum: 7
                  example: 7
      responses:
        '200':
          description: 추천 성공 (부분 생성 포함)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyRecommendation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/AiServiceError'

components:
  schemas:
    # -------------------------------------------------------
    # 공통
    # -------------------------------------------------------
    PagedResponse:
      type: object
      description: 페이지네이션 목록 응답 공통 구조. content 필드에 실제 데이터 배열이 담깁니다.
      properties:
        content:
          type: array
          items: {}
        total_elements:
          type: integer
          example: 14
        total_pages:
          type: integer
          example: 1
        page:
          type: integer
          description: 현재 페이지 (1부터 시작)
          example: 1
        size:
          type: integer
          example: 20

    Error:
      type: object
      required: [code, error_code, message]
      properties:
        code:
          type: integer
          description: HTTP 상태 코드
          example: 400
        error_code:
          type: string
          description: 화면 분기용 에러 식별자
          example: INVALID_FILE
        message:
          type: string
          description: 사용자 노출 메시지
          example: 5MB 이하의 JPG 또는 PNG 파일만 업로드할 수 있어요.

    # -------------------------------------------------------
    # Enum
    # -------------------------------------------------------
    ClothingCategory:
      type: string
      description: TOP(상의) / BOTTOM(하의) / SHOES(신발) / HAT(모자) / ACC(액세서리)
      enum: [TOP, BOTTOM, SHOES, HAT, ACC]

    SeasonType:
      type: string
      description: SPRING(봄) / SUMMER(여름) / FALL(가을) / WINTER(겨울) / ALL(사계절)
      enum: [SPRING, SUMMER, FALL, WINTER, ALL]

    ClothingColor:
      type: string
      description: 의류 색상 (화면 표시값 그대로 사용)
      enum: [블랙, 화이트, 그레이, 베이지, 브라운, 블루, 골드]

    ClothingSource:
      type: string
      description: PHOTO(사진 등록) / TEXT(문장 등록) / MANUAL(직접 등록)
      enum: [PHOTO, TEXT, MANUAL]

    OutfitSource:
      type: string
      description: AI(AI 추천) / MANUAL(직접 제작) / RANDOM(오늘의 픽) / CHALLENGE(챌린지)
      enum: [AI, MANUAL, RANDOM, CHALLENGE]

    # -------------------------------------------------------
    # 사용자 · 인증
    # -------------------------------------------------------
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: demo@today-outfit.app
        name:
          type: string
          example: 데모 사용자
        is_demo:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time

    AuthToken:
      type: object
      properties:
        access_token:
          type: string
          description: JWT Access Token
          example: eyJhbGciOiJIUzI1NiJ9...
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: 만료까지 남은 시간(초)
          example: 3600
        user:
          $ref: '#/components/schemas/User'

    # -------------------------------------------------------
    # 의류
    # -------------------------------------------------------
    ClothingCandidate:
      type: object
      description: AI가 추정한 의류 속성 후보 (미저장)
      properties:
        name:
          type: string
          example: 블랙 슬랙스
        category:
          $ref: '#/components/schemas/ClothingCategory'
        color:
          $ref: '#/components/schemas/ClothingColor'
        season:
          $ref: '#/components/schemas/SeasonType'

    PhotoAnalysisResult:
      description: 사진 분석 결과 = 업로드 사진 정보 + 의류 속성 후보
      allOf:
        - $ref: '#/components/schemas/ImageUpload'
        - $ref: '#/components/schemas/ClothingCandidate'

    ImageUpload:
      type: object
      properties:
        image_url:
          type: string
          example: https://cdn.today-outfit.app/clothes/2026/09/a1b2c3.jpg
        image_file_name:
          type: string
          example: my_slacks.jpg

    ClothingCreateRequest:
      type: object
      required: [name, category, color, season, source]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: 블랙 슬랙스
        category:
          $ref: '#/components/schemas/ClothingCategory'
        color:
          $ref: '#/components/schemas/ClothingColor'
        season:
          $ref: '#/components/schemas/SeasonType'
        source:
          $ref: '#/components/schemas/ClothingSource'
        image_url:
          type: string
          nullable: true
          description: 업로드 사진 URL (선택)
        image_file_name:
          type: string
          nullable: true

    Clothing:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 3
        name:
          type: string
          example: 블랙 슬랙스
        category:
          $ref: '#/components/schemas/ClothingCategory'
        color:
          $ref: '#/components/schemas/ClothingColor'
        season:
          $ref: '#/components/schemas/SeasonType'
        image_url:
          type: string
          nullable: true
          description: 업로드 사진 URL. null이면 클라이언트가 카테고리+색상 대표 사진으로 대체
        image_file_name:
          type: string
          nullable: true
        source:
          $ref: '#/components/schemas/ClothingSource'
        created_at:
          type: string
          format: date-time

    ClothingSummary:
      type: object
      description: 썸네일 표시용 의류 요약 (코디·플래너·챌린지 화면)
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        category:
          $ref: '#/components/schemas/ClothingCategory'
        color:
          $ref: '#/components/schemas/ClothingColor'
        image_url:
          type: string
          nullable: true

    # -------------------------------------------------------
    # 코디
    # -------------------------------------------------------
    OutfitSlot:
      type: object
      description: 카테고리 슬롯별 의류 (없으면 clothing = null)
      properties:
        category:
          $ref: '#/components/schemas/ClothingCategory'
        clothing:
          allOf:
            - $ref: '#/components/schemas/ClothingSummary'
          nullable: true

    OutfitCreateRequest:
      type: object
      required: [name, source, clothing_ids]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: 주말 나들이룩
        memo:
          type: string
          maxLength: 500
          nullable: true
        source:
          $ref: '#/components/schemas/OutfitSource'
        clothing_ids:
          type: array
          minItems: 1
          description: 구성 의류 ID (배열 순서 = 표시 순서)
          items:
            type: integer
            format: int64
          example: [1, 4, 7, 12]
        request_text:
          type: string
          maxLength: 500
          nullable: true
          description: AI 추천 시 입력한 상황 (source=AI)
        ai_reason:
          type: string
          nullable: true
          description: AI 추천 이유 (source=AI)
        ai_score:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          description: AI 평가 점수 (source=CHALLENGE)
        ai_comment:
          type: string
          nullable: true
          description: AI 평가 코멘트 (source=CHALLENGE)
        ai_tags:
          type: array
          nullable: true
          maxItems: 5
          items:
            type: string
          example: [캐주얼, 미니멀, 데일리룩]

    OutfitSummary:
      type: object
      description: 코디 카드 표시용 요약 (썸네일 최대 3개)
      properties:
        id:
          type: integer
          format: int64
          example: 21
        name:
          type: string
          example: 오피스 캐주얼
        source:
          $ref: '#/components/schemas/OutfitSource'
        ai_score:
          type: integer
          nullable: true
          example: 87
        thumbnails:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/ClothingSummary'
        created_at:
          type: string
          format: date-time

    OutfitDetail:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        memo:
          type: string
          nullable: true
        source:
          $ref: '#/components/schemas/OutfitSource'
        request_text:
          type: string
          nullable: true
        ai_reason:
          type: string
          nullable: true
        ai_score:
          type: integer
          nullable: true
        ai_comment:
          type: string
          nullable: true
        ai_tags:
          type: array
          items:
            type: string
        items:
          type: array
          description: 구성 의류 (item_order 오름차순)
          items:
            type: object
            properties:
              item_order:
                type: integer
                example: 1
              clothing:
                $ref: '#/components/schemas/ClothingSummary'
        created_at:
          type: string
          format: date-time

    OutfitRecommendation:
      type: object
      properties:
        slots:
          type: array
          items:
            $ref: '#/components/schemas/OutfitSlot'
        clothing_ids:
          type: array
          description: 저장 요청(POST /outfits)에 그대로 사용할 의류 ID 목록
          items:
            type: integer
            format: int64
        ai_reason:
          type: string
          example: '"친구와 카페" 상황에 어울리도록 활동성과 색상 조합을 고려해 골랐습니다.'
        suggested_name:
          type: string
          description: 코디 이름 기본값 (상황 앞 12자 + " 코디")
          example: 친구와 카페에서 만나 코디

    OutfitEvaluation:
      type: object
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
          example: 87
        comment:
          type: string
          example: 톤온톤 매치가 돋보이는 깔끔한 선택이에요.
        tags:
          type: array
          maxItems: 3
          items:
            type: string
          example: [미니멀, 오피스룩, 레이어드]

    # -------------------------------------------------------
    # 홈 · 플래너 · 챌린지
    # -------------------------------------------------------
    Schedule:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 5
        plan_date:
          type: string
          format: date
          example: '2026-09-17'
        outfit:
          $ref: '#/components/schemas/OutfitSummary'
        updated_at:
          type: string
          format: date-time
          nullable: true

    HomeSummary:
      type: object
      properties:
        clothes_count:
          type: integer
          description: 보유 의류 수 ("보유 의류 N벌 중에서 골라드릴게요")
          example: 14
        today_schedule:
          allOf:
            - $ref: '#/components/schemas/Schedule'
          nullable: true
          description: 오늘 날짜 배치 (없으면 null)

    WeeklyRecommendation:
      type: object
      properties:
        requested_days:
          type: integer
          example: 7
        generated_days:
          type: integer
          description: 실제 생성 일수 (requested_days보다 작으면 "N일치만 생성했어요" 안내)
          example: 7
        days:
          type: array
          items:
            type: object
            properties:
              plan_date:
                type: string
                format: date
              slots:
                type: array
                items:
                  $ref: '#/components/schemas/OutfitSlot'
              clothing_ids:
                type: array
                items:
                  type: integer
                  format: int64
              ai_reason:
                type: string

    ChallengeRounds:
      type: object
      properties:
        rounds:
          type: array
          items:
            type: object
            properties:
              round:
                type: integer
                description: 라운드 번호 (1부터)
                example: 1
              category:
                $ref: '#/components/schemas/ClothingCategory'
              left:
                $ref: '#/components/schemas/ClothingSummary'
              right:
                $ref: '#/components/schemas/ClothingSummary'
        skipped_categories:
          type: array
          description: 후보가 2벌 미만이라 건너뛴 카테고리
          items:
            $ref: '#/components/schemas/ClothingCategory'

  responses:
    BadRequest:
      description: 잘못된 요청 (필수값 누락, 형식 오류, 비밀번호 불일치, 파일 형식/용량 초과 등)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 400
            error_code: INVALID_FILE
            message: 5MB 이하의 JPG 또는 PNG 파일만 업로드할 수 있어요.
    Unauthorized:
      description: 인증 실패 (로그인 정보 불일치, 토큰 없음/만료)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 401
            error_code: UNAUTHORIZED
            message: 이메일 또는 비밀번호가 올바르지 않습니다.
    NotFound:
      description: 리소스 없음 (삭제되었거나 본인 소유가 아님)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 404
            error_code: NOT_FOUND
            message: 삭제되었거나 존재하지 않는 코디입니다.
    Conflict:
      description: 중복 데이터
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 409
            error_code: EMAIL_DUPLICATED
            message: 이미 가입된 이메일입니다.
    UnprocessableEntity:
      description: 처리 불가 (보유 의류 부족 등 비즈니스 조건 미충족)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 422
            error_code: NO_CLOTHES
            message: 보유 의류가 부족해 추천을 만들 수 없어요.
    TooManyRequests:
      description: AI 일일 호출 한도 초과
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 429
            error_code: AI_RATE_LIMITED
            message: 오늘 사용할 수 있는 AI 요청을 모두 사용했어요.
    ServerError:
      description: 서버 내부 오류 (데모 계정 · 샘플 데이터 생성 실패 등)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 500
            error_code: INTERNAL_ERROR
            message: 일시적인 오류가 발생했어요. 잠시 후 다시 시도해주세요.
    AiServiceError:
      description: 외부 AI 모델 호출 실패 (타임아웃, 인식 불가)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 502
            error_code: AI_ANALYSIS_FAILED
            message: AI 분석에 실패했어요. 수동 등록으로 이동해주세요.

  parameters:
    PageParam:
      name: page
      in: query
      required: false
      description: 페이지 번호 (1부터 시작)
      schema:
        type: integer
        default: 1
        minimum: 1
    SizeParam:
      name: size
      in: query
      required: false
      description: 페이지당 항목 수
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    ClothingIdPath:
      name: clothingId
      in: path
      required: true
      description: 의류 ID
      schema:
        type: integer
        format: int64
    OutfitIdPath:
      name: outfitId
      in: path
      required: true
      description: 코디 ID
      schema:
        type: integer
        format: int64
    PlanDatePath:
      name: planDate
      in: path
      required: true
      description: 배치 날짜 (YYYY-MM-DD)
      schema:
        type: string
        format: date
        example: '2026-09-17'
